name: Feature request
description: Suggest an improvement or new workflow.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the workflow you want to make easier. Keep secrets and private chat data out of the issue.
  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: What are you trying to do with the bot?
      placeholder: "I want to..."
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
      description: What should the bot do?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform scope
      options:
        - All platforms
        - Linux
        - macOS
        - Windows
        - WSL
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
